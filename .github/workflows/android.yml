name: Android CI
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK first
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify actual APK and ARM64 libbox
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/libbox.so' /tmp/apk-files.txt
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-vpn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests and Android Lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace
