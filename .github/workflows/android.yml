name: Android CI
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile, test, lint, assemble
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Check native engine
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/libgojni.so' /tmp/apk-files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-vpn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
