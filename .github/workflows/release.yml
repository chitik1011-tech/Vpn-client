name: Signed Android Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare release signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          VPN_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          VPN_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          VPN_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 secret}"
          : "${VPN_RELEASE_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${VPN_RELEASE_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          : "${VPN_RELEASE_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD secret}"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurora-release.jks"
          chmod 600 "$RUNNER_TEMP/aurora-release.jks"
          echo "VPN_RELEASE_KEYSTORE=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"
      - name: Compile and sign
        env:
          VPN_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          VPN_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          VPN_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify ARM64 and signed APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libbox.so'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-vpn-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
